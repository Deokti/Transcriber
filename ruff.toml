# Правила проверки стиля. Нужны, чтобы команда `ruff check` что-то значила:
# без своего набора она ругается на осознанные решения проекта, а проверка,
# которая всегда красная, не проверка.

line-length = 100
target-version = "py312"

[lint]
# Ошибки, мёртвый код, ловушки, упрощения и подсказки о качестве.
# Сортировку импортов (I) не включаем: порядок здесь смысловой — сначала
# чужое, потом своё, — и автоматическая перестановка его ломает.
select = ["E", "F", "W", "B", "SIM", "PL", "RUF"]

ignore = [
    # Импорт внутри функции — здесь приём, а не оплошность: faster-whisper и
    # huggingface тянут за собой полсекунды и сотни мегабайт, и грузить их
    # при показе окна не нужно.
    "PLC0415",
    # subprocess.run без check=: код возврата разбирается руками, потому что
    # из него делается событие ядра, а не исключение.
    "PLW1510",
    # try/except/pass против contextlib.suppress: в этих местах рядом стоит
    # комментарий, зачем молчим, и suppress его прячет.
    "SIM105",
    # Вложенные with в тестах: подмена за подменой читается лучше в столбик.
    "SIM117",
    # Магические числа: в разметке и замерах это размеры и пороги, которые
    # понятнее числом на месте.
    "PLR2004",
    # Длинные списки аргументов: у extract_audio их столько, сколько у ffmpeg
    # ключей, и прятать их в объект незачем.
    "PLR0913",
    # Кириллица в строках и комментариях — это и есть язык документа.
    "RUF001", "RUF002", "RUF003",
    # Изменяемое значение по умолчанию в классе: у Qt-мостов это нормально.
    "RUF012",
    # global для состояния уровня процесса: подключённые библиотеки CUDA и
    # счётчик нажатий Ctrl+C живут ровно столько, сколько процесс, и класс
    # вокруг них был бы обёрткой ради обёртки.
    "PLW0603",
]

[lint.per-file-ignores]
# Тесты печатают ход проверки и ловят всё подряд нарочно: их дело — сказать,
# что сломалось, а не упасть первым же исключением.
"tests/*" = ["PLR0912", "PLR0915", "BLE001"]
# Слова для консоли — длинная таблица кодов, и это её естественный вид.
"cli/messages.py" = ["PLR0911", "PLR0912", "PLR0915"]
# Точки входа читаются сверху вниз, как сценарий: разбор ключей, подъём
# мостов, запуск. Разрезать их на функции ради счётчика ветвлений — значит
# заставить читателя прыгать по файлу.
"cli/main.py" = ["PLR0912", "PLR0915"]
"app/main.py" = ["PLR0915"]
# Разбор событий ядра — одна развилка на вид события, с пояснением у каждой.
"app/bridge/run.py" = ["PLR0912", "PLR0915"]
